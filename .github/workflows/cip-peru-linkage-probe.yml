name: M1 Peru public field and mineral sample linkage inventory

on:
  push:
    branches: [research/m1-nutrition-baseline]
    paths: [".github/workflows/cip-peru-linkage-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inventory publicly accessible source columns without exposing participant records
        run: |
          python - <<'PY'
          import collections,csv,hashlib,io,json,pathlib,urllib.parse,urllib.request
          doi="doi:10.21223/N11QJS"
          base="https://data.cipotato.org/api/datasets/:persistentId/?persistentId="
          def get_json(url):
              req=urllib.request.Request(url,headers={"User-Agent":"OpenPotato-M1-13-Public-Schema/0.1"})
              with urllib.request.urlopen(req,timeout=40) as f:return json.load(f)
          metadata=get_json(base+urllib.parse.quote(doi,safe=""))
          if metadata.get("status")!="OK":
              raise ValueError("CIP Dataverse metadata unavailable")
          ver=metadata["data"]["latestVersion"]
          if (ver.get("versionNumber"),ver.get("versionMinorNumber"))!=(1,0):
              raise ValueError("Expected CIP 1.0, manual review required")
          allowed={6982:"mineral_shipment",6972:"field_calendar",6971:"flowering_selection",
                   6968:"harvest_selection",6975:"soil_sample_list"}
          listing={f["dataFile"]["id"]:f for f in ver.get("files",[])}
          result={"dataset_doi":doi,"version":"1.0","sources":{}}
          for id,label in allowed.items():
              entry=listing.get(id)
              if entry is None or entry.get("restricted",entry["dataFile"].get("restricted",True)):
                  raise ValueError("File missing or RESTRICTED: "+str(id))
              url=f"https://data.cipotato.org/api/access/datafile/{id}"
              req=urllib.request.Request(url,headers={"User-Agent":"OpenPotato-M1-13-Public-Schema/0.1"})
              with urllib.request.urlopen(req,timeout=45) as resp:
                  raw=resp.read()
                  mime=resp.headers.get("Content-Type","")
              if not mime.startswith("text/tab-separated-values"):
                  raise ValueError("Unexpected source MIME for public file "+str(id))
              rows=list(csv.reader(io.StringIO(raw.decode("utf-8-sig")),delimiter="\t"))
              if not rows:raise ValueError("Empty public table")
              widths=collections.Counter(map(len,rows))
              header=rows[0]
              nonempty=[sum(bool(row[i].strip()) for row in rows[1:] if len(row)>i)
                        for i in range(len(header))]
              report={"file_id":id,"label":label,"name":entry["dataFile"].get("filename"),
                      "source_sha256":hashlib.sha256(raw).hexdigest(),
                      "md5_export":hashlib.md5(raw).hexdigest(),
                      "stored_md5_metadata":entry["dataFile"].get("md5"),
                      "row_count_including_header":len(rows),"columns":len(header),
                      "row_widths":dict(widths),"header":header,
                      "nonempty_by_column":nonempty}
              result["sources"][label]=report
              # No row values logged: some participant-selection tables may contain PII.
              print("PUBLIC_TABLE_SCHEMA",json.dumps(report,ensure_ascii=False),flush=True)
          dest=pathlib.Path("/tmp/m1-13-public-linkage")
          dest.mkdir(exist_ok=True)
          (dest/"public_sources_schema.json").write_text(
              json.dumps(result,indent=2,ensure_ascii=False,sort_keys=True)+"\n",
              encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m1-13-public-cip-schema-no-participant-records
          retention-days: 30
          path: /tmp/m1-13-public-linkage/public_sources_schema.json
