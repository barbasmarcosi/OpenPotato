name: M1 CIP genotype source probe

on:
  push:
    branches: [research/m1-nutrition-baseline]
    paths: [".github/workflows/genotype-source-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener texto completo primario y verificar tablas legibles
        run: |
          curl --fail -L --retry 2 --max-time 90 -sS             'https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10383430/fullTextXML'             -o /tmp/potato-original.xml
          python - <<'PY'
          import xml.etree.ElementTree as E,hashlib
          b=open('/tmp/potato-original.xml','rb').read()
          root=E.fromstring(b)
          print("XML source bytes",len(b),"SHA-256",hashlib.sha256(b).hexdigest())
          for tw in root.findall('.//table-wrap'):
              print("TABLE",tw.attrib.get('id'),''.join(tw.find('label').itertext()) if tw.find('label') is not None else '?')
              table=tw.find('.//table')
              if table is not None:
                  rows=table.findall('.//tr')
                  print("N_ROWS",len(rows),"FIRST",[' '.join(' '.join(c.itertext()).split())[:65] for c in rows[0]] if rows else [])
                  if tw.attrib.get('id','').endswith('t002'):
                      print("LAST",[' '.join(' '.join(c.itertext()).split())[:50] for c in rows[-1]] if rows else [])
          PY
