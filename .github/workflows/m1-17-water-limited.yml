name: M1-17 WOFOST81 water-limited hypothetical soil sensitivities

on:
  push:
    branches: [research/m1-nutrition-baseline]
    paths:
      - "scripts/wofost_water_sensitivity.py"
      - "tests/test_wofost_water_sensitivity.py"
      - ".github/workflows/m1-17-water-limited.yml"
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned WOFOST engine
        run: python -m pip install "pcse==6.0.13"
      - name: Verify entire existing scientific test suite
        env:
          PYTHONPATH: .:src
        run: python -m unittest discover -s tests -v
      - name: Simulate WOFOST WLP on archival NASA data with explicitly assumed soil and no irrigation
        env:
          PYTHONPATH: .:src
        run: |
          python -m scripts.wofost_water_sensitivity \
            --weather-dir datasets/wofost_potato_m1_16/weather \
            --baseline datasets/wofost_potato_m1_16/model/generic_potato_potential_scenarios.csv \
            --out /tmp/openpotato-m1-17
      - name: Fail closed if outputs imply observed yields, nutritional or unproven baseline
        run: |
          python - <<'PY'
          import csv,hashlib,json,pathlib
          root=pathlib.Path("/tmp/openpotato-m1-17")
          m=json.loads((root/"water_limited_provenance.json").read_text())
          rows=list(csv.DictReader((root/"water_limited_scenarios.csv").open()))
          daily=list(csv.DictReader((root/"water_limited_daily.csv").open()))
          assert m["status"]=="WOFOST_WATER_LIMITED_SCENARIO_ONLY_UNCALIBRATED"
          assert m["model"]=="Wofost81_WLP_CWB"
          assert m["simulated_scenarios"]==len(rows)==48
          assert m["simulated_daily_rows"]==len(daily)>6000
          assert m["no_irrigation"] is True
          assert m["nitrogen_unlimited"] is True
          assert m["not_real_soil_or_genotype_prediction"] is True
          assert set(m["weather_snapshot_sha256"])=={"neuquen","trenque_lauquen"}
          for key,digest in m["weather_snapshot_sha256"].items():
            path=pathlib.Path("datasets/wofost_potato_m1_16/weather")/(key+".json")
            assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          for key,digest in m["scenario_csv_sha256"].items():
            assert hashlib.sha256((root/key).read_bytes()).hexdigest()==digest
          assert all(float(row["water_limited_storage_dry_kg_ha"])>=0 for row in rows)
          assert all(row["irrigation_mm_assumed"]=="0" for row in rows)
          assert all(float(row["nasa_cumulative_rainfall_cm_during_simulated_days"])>=0 for row in rows)
          assert all(float(row["total_actual_transpiration_cm"])>=0 for row in rows)
          assert all(int(row["days_with_RFTRA_below_0_99"])>=0 for row in rows)
          assert all(int(row["days_with_RFTRA_below_0_99"])<=int(row["days_simulated"]) for row in rows)
          assert m["daily_transpiration_cm_summed_from_WOFOST_TRA"] is True
          assert m["water_stress_days_defined_RFTRA_lt_0_99"] is True
          assert all(row["interpretation"]==m["status"] for row in rows)
          assert "genotype_id" not in rows[0] and "iron" not in rows[0] and "zinc" not in rows[0]
          print("WATER SENSITIVITY VERIFIED: 48 explicit counterfactuals only")
          print((root/"water_limited_report.md").read_text()[:6000])
          PY
      - name: Verify exact scientific replay or documented schema v1 to v2 migration
        run: |
          if test -f datasets/wofost_potato_m1_17/water_limited_provenance.json; then
            python - <<'PY'
          import csv,json,pathlib
          oldroot=pathlib.Path("datasets/wofost_potato_m1_17")
          newroot=pathlib.Path("/tmp/openpotato-m1-17")
          old=json.loads((oldroot/"water_limited_provenance.json").read_text())
          new=json.loads((newroot/"water_limited_provenance.json").read_text())
          assert old["weather_snapshot_sha256"]==new["weather_snapshot_sha256"],"NASA source drift"
          assert old["potential_baseline_csv_sha256"]==new["potential_baseline_csv_sha256"],"PP baseline drift"
          assert old["hypothetical_soil_profiles"]==new["hypothetical_soil_profiles"],"Soil assumptions drift"
          assert old["initial_available_water_cm_assumed"]==new["initial_available_water_cm_assumed"],"Initial-water assumptions drift"
          assert old["simulated_scenarios"]==new["simulated_scenarios"]==48
          if old.get("schema_version")=="2.0":
            assert old["scenario_csv_sha256"]==new["scenario_csv_sha256"],"Unexpected WLP v2 output drift"
            print("SUCCESS: exact replay of accepted v2 WOFOST water-limited outputs")
          else:
            # One-time migration of output columns ONLY: previously published
            # v1 model/series hashes are fixed. Every physical result must be
            # unchanged for all 48 scenarios and all 8040 daily records.
            assert new["schema_version"]=="2.0"
            assert old["scenario_csv_sha256"]["water_limited_scenarios.csv"]==new["schema_v1_model_csv_sha256"]
            assert old["scenario_csv_sha256"]["water_limited_daily.csv"]==new["schema_v1_daily_csv_sha256"]
            assert new["scenario_csv_sha256"]["water_limited_daily.csv"]==old["scenario_csv_sha256"]["water_limited_daily.csv"]
            def rows(path):
              with path.open(newline="",encoding="utf-8") as f:
                return list(csv.DictReader(f))
            oldrows=rows(oldroot/"water_limited_scenarios.csv")
            newrows=rows(newroot/"water_limited_scenarios.csv")
            assert len(oldrows)==len(newrows)==48
            oldby={r["scenario_id"]:r for r in oldrows}
            newby={r["scenario_id"]:r for r in newrows}
            assert set(oldby)==set(newby)
            unchanged_fields=[
              "site_label","campaign","assumed_emergence","assumed_harvest",
              "soil_profile_hypothetical","initial_water_label",
              "initial_available_water_cm_assumed","irrigation_mm_assumed",
              "water_limited_storage_dry_kg_ha","potential_storage_dry_kg_ha",
              "water_limited_to_potential_ratio_descriptive","days_simulated",
              "average_root_zone_moisture_m3_m3","weather_snapshot_sha256","interpretation",
            ]
            for key in oldby:
              for field in unchanged_fields:
                assert oldby[key][field]==newby[key][field],f"Scientific model change in {field}"
            assert all(r["total_actual_transpiration_cm"]!="" for r in newrows)
            assert all(r["nasa_cumulative_rainfall_cm_during_simulated_days"]!="" for r in newrows)
            print("SUCCESS: one-time v1→v2 schema migration; exact 48 WOFOST physics unchanged and daily SHA unchanged")
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: m1-17-hypothetical-soils-UNVALIDATED-water-limited-potato
          retention-days: 30
          path: /tmp/openpotato-m1-17/

  publish:
    needs: simulate
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/m1-nutrition-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m1-17-hypothetical-soils-UNVALIDATED-water-limited-potato
          path: datasets/wofost_potato_m1_17/
      - name: Commit ONLY labeled counterfactual outputs after passing tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/wofost_potato_m1_17/
          if ! git diff --cached --quiet; then
            git commit -m "data(M1-17): pin counterfactual water-limited WOFOST scenarios"
            git fetch origin research/m1-nutrition-baseline
            git rebase origin/research/m1-nutrition-baseline
            git push origin HEAD:research/m1-nutrition-baseline
          fi
