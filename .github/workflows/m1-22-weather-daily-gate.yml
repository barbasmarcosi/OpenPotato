name: M1-22 WUR source weather chronology and strict unit gates
on:
  push:
    branches: [research/m1-nutrition-baseline]
    paths:
      - '.github/workflows/m1-22-weather-daily-gate.yml'
      - 'scripts/wur_weather_daily_gate.py'
      - 'tests/test_wur_weather_daily_gate.py'
      - 'scripts/wur_weather_column_audit.py'
      - 'tests/test_wur_weather_column_audit.py'
      - 'scripts/wur_weather_semantics_gate.py'
      - 'tests/test_wur_weather_semantics_gate.py'
      - 'scripts/wur_weather_holdout_exposure.py'
      - 'tests/test_wur_weather_holdout_exposure.py'
      - 'scripts/wur_pcse_source_contract.py'
      - 'tests/test_wur_pcse_source_contract.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Excel-only scientific input dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Reject invalid dates, physical units and weather before any crop model
        env:
          PYTHONPATH: .:src
        run: |
          python -m unittest discover -s tests -p 'test_wur_weather_daily_gate.py' -v
          python -m unittest discover -s tests -p 'test_wur_weather_column_audit.py' -v
          python -m unittest discover -s tests -p 'test_wur_weather_semantics_gate.py' -v
          python -m unittest discover -s tests -p 'test_wur_weather_holdout_exposure.py' -v
          python -m unittest discover -s tests -p 'test_wur_pcse_source_contract.py' -v
      - name: Fetch and hash-lock original public WUR XLSX with license/version checks
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,urllib.parse,urllib.request
          base='https://dataverse.harvard.edu/api'
          doi='doi:10.7910/DVN/1LC6W7'
          req=urllib.request.Request(base+'/datasets/:persistentId/?persistentId='+urllib.parse.quote(doi,safe=''),headers={'User-Agent':'OpenPotato-M1-22-WeatherChronology/1.0'})
          with urllib.request.urlopen(req,timeout=50) as f: obj=json.load(f)
          if obj.get('status')!='OK':raise ValueError('Dataverse source unavailable')
          version=obj['data']['latestVersion']
          if (version.get('versionNumber'),version.get('versionMinorNumber'))!=(3,0):raise ValueError('Source version changed')
          if version.get('license',{}).get('name')!='CC BY-NC-SA 4.0':raise ValueError('Source rights changed')
          files={r['dataFile']['id']:r for r in version['files']}
          expected={10284792:('Weatherfile_lelystad.xlsx','ad66a23468a969b5795a656fb6989499e790a3e18179b9e3158f203b12ab8636'),
                    10284786:('Weatherfile_vredepeel.xlsx','0bb40a5aa91ae6bfd02a8e8b4f825e4d834207884c1f2f44caa12fd0e88a1fd6')}
          for id,(filename,sha) in expected.items():
              row=files.get(id)
              if not row or row.get('restricted',row['dataFile'].get('restricted',True)) or row['dataFile']['filename']!=filename:
                  raise ValueError('Public license/file identification changed')
              req=urllib.request.Request(base+'/access/datafile/'+str(id),headers={'User-Agent':'OpenPotato-M1-22-WeatherChronology/1.0'})
              with urllib.request.urlopen(req,timeout=50) as f: blob=f.read()
              if hashlib.sha256(blob).hexdigest()!=sha:raise ValueError('Source XLSX SHA256 changed')
              pathlib.Path('/tmp/'+filename).write_bytes(blob)
          print('Verified WUR original public weather XLSX v3.0 and CC BY-NC-SA; private runner only')
          PY
      - name: Audit exact original climate workbook chronological coverage without publishing daily weather
        env:
          PYTHONPATH: .:src
        run: |
          python -m scripts.wur_weather_daily_gate --lelystad /tmp/Weatherfile_lelystad.xlsx --vredepeel /tmp/Weatherfile_vredepeel.xlsx --out /tmp/m1-22-source-counts
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/m1-22-source-counts/m1_22_weather_chronology_metadata_only.json')
          r=json.loads(p.read_text())
          assert len(r['sites'])==2 and not r['field_wofost_run_admissible']
          assert r['source_daily_weather_values_exported']==r['source_worksheet_rows_exported']==0
          assert r['license']=='CC BY-NC-SA 4.0'
          print('Audit completed: field WOFOST admission remains closed')
          PY
      - name: Count missing/nonfinite values by source weather column without exporting data
        env:
          PYTHONPATH: .:src
        run: |
          python -m scripts.wur_weather_column_audit --lelystad /tmp/Weatherfile_lelystad.xlsx --vredepeel /tmp/Weatherfile_vredepeel.xlsx --out /tmp/m1-22-source-counts
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/m1-22-source-counts/m1_23_weather_column_numeric_coverage.json')
          r=json.loads(p.read_text())
          assert len(r['sites'])==2 and not r['field_wofost_run_admissible']
          assert r['original_daily_observation_values_exported']==0
          assert r['original_header_strings_exported']==0
          print('Numeric coverage metadata only; meteorological dictionary has NOT been validated')
          PY
      - name: M1-24 weather source metadata and missing streak audit
        env:
          PYTHONPATH: .:src
        run: |
          python -m scripts.wur_weather_semantics_gate --lelystad /tmp/Weatherfile_lelystad.xlsx --vredepeel /tmp/Weatherfile_vredepeel.xlsx --out /tmp/m1-22-source-counts
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('/tmp/m1-22-source-counts/m1_24_weather_semantics_and_missingness.json').read_text())
          assert r['status']=='SOURCE_METADATA_AND_MISSINGNESS_AUDITED_NOT_WOFOST_READY'
          assert len(r['sites'])==2 and all(s['original_daily_dates']==1096 for s in r['sites'])
          assert all(s['daily_dates_by_year']=={'2018':365,'2019':365,'2020':366} for s in r['sites'])
          assert r['raw_workbooks_exported']==r['daily_weather_values_exported']==r['original_header_strings_exported']==0
          assert r['field_wofost_run_admissible'] is False
          for s in r['sites']:
              assert all(c['approved_pcse_field'] is None for c in s['columns'])
              for c in s['columns']:
                  for y in ('2019','2020'):
                      v=c['counts_by_year'][y]
                      assert v['finite_numeric']+v['missing_na']+v['untyped_nonfinite']==v['days']
          print('M1-24 meteorological readiness DENIED until units and management are independently reviewed')
          PY
      - name: M1-25 admission gate against last observed field sampling
        env:
          PYTHONPATH: .:src
        run: |
          python -m scripts.wur_weather_holdout_exposure --lelystad /tmp/Weatherfile_lelystad.xlsx --vredepeel /tmp/Weatherfile_vredepeel.xlsx --out /tmp/m1-22-source-counts
          python - <<'PY'
          import json,pathlib
          f=pathlib.Path('/tmp/m1-22-source-counts/m1_25_weather_holdout_exposure_counts.json')
          report=json.loads(f.read_text())
          assert report['original_daily_weather_values_exported']==0
          assert report['original_plot_data_exported']==0
          assert report['field_wofost_run_admissible'] is False
          sites={s['site']:s for s in report['sites']}
          assert set(sites)=={'Lelystad','Vredepeel'}
          assert sites['Vredepeel']['columns_with_missing_or_invalid_cells']==[]
          cols=sites['Lelystad']['columns_with_missing_or_invalid_cells']
          assert len(cols)==1 and cols[0]['source_column_1_based']==10
          y=cols[0]['coverage']['2020']
          assert y['missing_na']==92 and y['invalid']==0
          assert y['non_numeric_from_jan1_through_last_sample']==34
          assert y['non_numeric_after_last_sample']==58
          assert cols[0]['coverage']['2019']['missing_na']==0
          print('M1-25: source-verified 34 missing through last sample + 58 after; no WOFOST validation')
          PY
      - name: M1-26 original PCSE weather input schema consistency
        env:
          PYTHONPATH: .:src
        run: |
          python -m scripts.wur_pcse_source_contract --lelystad /tmp/Weatherfile_lelystad.xlsx --vredepeel /tmp/Weatherfile_vredepeel.xlsx --out /tmp/m1-22-source-counts
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('/tmp/m1-22-source-counts/m1_26_pcse_source_contract_counts.json').read_text())
          assert len(r['sites'])==2
          assert r['original_source_records_exported']==0
          assert not r['wofost_crop_model_field_validated']
          for site in r['sites']:
              assert site['schema_exact_native_pcse']
              assert site['mandatory_2019_2020_complete']
              assert site['unused_source_columns_one_based']==[8,10]
          print('PCSE weather input contract source verified, no crop model validation claimed')
          PY
      - name: Delete source weather workbooks regardless of success
        if: always()
        run: rm -f /tmp/Weatherfile_lelystad.xlsx /tmp/Weatherfile_vredepeel.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: m1-22-original-WUR-climate-chronology-COUNTS-only
          retention-days: 14
          path: /tmp/m1-22-source-counts/*.json
