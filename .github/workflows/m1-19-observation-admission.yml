name: M1-19 Real WUR potato field data admission and heldout diagnostics

on:
  push:
    branches: [research/m1-nutrition-baseline]
    paths:
      - "scripts/wur_potato_field_audit.py"
      - "scripts/tuber_dry_holdout_diagnostic.py"
      - "tests/test_wur_potato_field_audit.py"
      - "tests/test_tuber_dry_holdout_diagnostic.py"
      - ".github/workflows/m1-19-observation-admission.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Entire existing scientific test suite, plus dry-tuber source and holdout tests
        env:
          PYTHONPATH: .:src:tests
        run: python -m unittest discover -s tests -v
      - name: Download ORIGINAL Harvard potato field CSV ONLY if public license, restriction, version and checksum match
        run: |
          python - <<'PY'
          import json,hashlib,pathlib,urllib.request,urllib.parse
          from datetime import date
          doi="doi:10.7910/DVN/1LC6W7"
          url="https://dataverse.harvard.edu/api/datasets/:persistentId/?persistentId="+urllib.parse.quote(doi,safe="")
          req=urllib.request.Request(url,headers={"User-Agent":"OpenPotato-M1-19-VerifiedAdmission/0.1"})
          with urllib.request.urlopen(req,timeout=50) as r:
              obj=json.load(r)
          if obj.get("status")!="OK":raise ValueError("Dataverse source missing")
          version=obj["data"]["latestVersion"]
          if (version.get("versionNumber"),version.get("versionMinorNumber"))!=(3,0):
              raise ValueError("Source version needs manual scientific rebaseline")
          license=version.get("license",{})
          if license.get("name")!="CC BY-NC-SA 4.0":
              raise ValueError("Source license changed")
          files={f["dataFile"]["id"]:f for f in version["files"]}
          file=files.get(10850227)
          if not file or file.get("restricted",file["dataFile"].get("restricted",True)):
              raise ValueError("Original file must be public and unrestricted")
          if file["dataFile"]["filename"]!="Plotspecific_processed.csv":
              raise ValueError("Original file renamed or replaced")
          if file["dataFile"].get("md5")!="bdf0f745e2c496868e3285a43df0ff04":
              raise ValueError("Published original MD5 unexpectedly changed")
          url="https://dataverse.harvard.edu/api/access/datafile/10850227"
          req=urllib.request.Request(url,headers={"User-Agent":"OpenPotato-M1-19-VerifiedAdmission/0.1"})
          with urllib.request.urlopen(req,timeout=50) as r:
              blob=r.read()
          if (hashlib.md5(blob).hexdigest()!="bdf0f745e2c496868e3285a43df0ff04" or
              hashlib.sha256(blob).hexdigest()!="8d129262dca38ac98a10f92ccfb1bc46454377020575959fd984c4c5bcab5768"):
              raise ValueError("Original primary source bytes changed")
          directory=pathlib.Path("/tmp/m1-19-private-source-not-an-artifact")
          directory.mkdir(parents=True,exist_ok=True)
          (directory/"Plotspecific_processed.csv").write_bytes(blob)
          print("WUR SOURCE VERIFIED v3.0; CC BY-NC-SA; original source transient; 713587 bytes.")
          PY
      - name: Run first genuinely observed potato trial admission - publish only counts
        env:
          PYTHONPATH: .:src
        run: |
          python -m scripts.wur_potato_field_audit \
            --source /tmp/m1-19-private-source-not-an-artifact/Plotspecific_processed.csv \
            --out /tmp/m1-19-source-admission-only
      - name: Exercise holdout comparison end to end with SYNTHETIC data only
        env:
          PYTHONPATH: .:src:tests
        run: |
          python - <<'PY'
          import json,pathlib
          from test_tuber_dry_holdout_diagnostic import test_records,emit
          from scripts.tuber_dry_holdout_diagnostic import compare
          folder=pathlib.Path("/tmp/m1-19-fixture-FICTIONAL")
          folder.mkdir(exist_ok=True)
          files=emit(folder,*test_records())
          report=compare(files["observed"],files["predicted"],files["manifest"],
                         pathlib.Path("/tmp/m1-19-SYNTHETIC-model-diagnostic-only"))
          assert report["compared_group_means_count"]==4
          assert report["site_year_groups_count"]==2
          assert report["plot_group_mae_rmse_descriptive_only"]["rmse_dry_kg_ha"]==15
          assert report["real_external_field_validation_completed"] is False
          print("SYNTHETIC CONTRACT EXERCISE: RMSE=15 dry kg/ha (NOT measured).")
          PY
      - name: Assert published audit never contains licensed individual field records
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("/tmp/m1-19-source-admission-only")
          data=json.loads((root/"wur_2019_2020_real_trial_source_admission.json").read_text())
          assert data["license"]=="CC BY-NC-SA 4.0"
          assert data["total_original_rows_inspected_without_export"]==1824
          assert data["source_sha256"]=="8d129262dca38ac98a10f92ccfb1bc46454377020575959fd984c4c5bcab5768"
          assert data["observation_rows_exported"]==data["source_yield_values_exported"]==0
          assert len(data["year_site_counts"])==4
          measured={d["original_column"]:d["finite_numeric_entries"]
                    for d in data["measurements_available"]}
          assert measured["tubersDW"]==1048
          assert measured["tubersFW"]==1063
          assert measured["Yield_gross_t.ha"]==87
          # No raw values from the original restricted-license field CSV
          for file in root.iterdir():
              text=file.read_text()
              assert '"plot_id":' not in text and '"Plotnumber":' not in text
              assert '"observed_value":' not in text and '"Yield_gross_t.ha": {' not in text
          print("REAL OBSERVATION SOURCE ADMITTED FOR FUTURE CALIBRATION; model not yet fitted.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m1-19-REAL-WUR-SCHEMA-COUNTS-ONLY-no-raw-observations
          retention-days: 30
          path: /tmp/m1-19-source-admission-only/
      - uses: actions/upload-artifact@v4
        with:
          name: m1-19-FICTIONAL-holdout-metrics-not-actual-field-predictions
          retention-days: 7
          path: /tmp/m1-19-SYNTHETIC-model-diagnostic-only/

  publish-sanitized-metadata:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/m1-nutrition-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m1-19-REAL-WUR-SCHEMA-COUNTS-ONLY-no-raw-observations
          path: research/field_observations_m1_19/
      - name: Publish attribution, noncommercial provenance and counts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/field_observations_m1_19/
          if ! git diff --cached --quiet; then
            git commit -m "research(M1-19): register verified real potato trial availability and NC-SA license WITHOUT plot records"
            git fetch origin research/m1-nutrition-baseline
            git rebase origin/research/m1-nutrition-baseline
            git push origin HEAD:research/m1-nutrition-baseline
          fi
