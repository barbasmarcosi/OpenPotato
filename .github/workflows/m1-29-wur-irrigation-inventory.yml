name: M1-29 WUR original irrigation workbook structural audit
on:
  push:
    branches: [research/m1-nutrition-baseline]
    paths:
      - ".github/workflows/m1-29-wur-irrigation-inventory.yml"
      - "scripts/wur_irrigation_source_inventory.py"
      - "tests/test_wur_irrigation_source_inventory.py"
      - "scripts/wur_irrigation_schema_probe.py"
      - "tests/test_wur_irrigation_schema_probe.py"
      - "scripts/wur_irrigation_event_admission.py"
      - "tests/test_wur_irrigation_event_admission.py"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-irrigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin Excel reader dependency for source inventory only
        run: python -m pip install openpyxl==3.1.5
      - name: Unit tests with invented weatherless irrigation workbook
        env: {PYTHONPATH: ".:src"}
        run: |
          python -m unittest discover -s tests -p 'test_wur_irrigation_source_inventory.py' -v
          python -m unittest discover -s tests -p 'test_wur_irrigation_schema_probe.py' -v
          python -m unittest discover -s tests -p 'test_wur_irrigation_event_admission.py' -v
      - name: Verify public original irrigation file, version, license, and original checksum
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,urllib.parse,urllib.request
          base='https://dataverse.harvard.edu/api'
          doi='doi:10.7910/DVN/1LC6W7'
          req=urllib.request.Request(
              base+'/datasets/:persistentId/?persistentId='+urllib.parse.quote(doi,safe=''),
              headers={'User-Agent':'OpenPotato-M1-29-IrrigationInventory/1.0'})
          with urllib.request.urlopen(req,timeout=50) as f: obj=json.load(f)
          if obj.get('status')!='OK':raise ValueError('Dataverse source missing')
          meta=obj['data']['latestVersion']
          if (meta.get('versionNumber'),meta.get('versionMinorNumber'))!=(3,0):
              raise ValueError('Dataset revision changed')
          if meta.get('license',{}).get('name')!='CC BY-NC-SA 4.0':
              raise ValueError('Original source license changed')
          original=next((x for x in meta['files'] if x['dataFile']['id']==10284791),None)
          if not original or original.get('restricted',original['dataFile'].get('restricted',True)):
              raise ValueError('Irrigation source access not verified')
          data=original['dataFile']
          if data['filename']!='Irrigation.xlsx' or not data.get('md5'):
              raise ValueError('Irrigation source identity or source MD5 missing')
          req=urllib.request.Request(base+'/access/datafile/10284791',
                                    headers={'User-Agent':'OpenPotato-M1-29-IrrigationInventory/1.0'})
          with urllib.request.urlopen(req,timeout=60) as f: content=f.read()
          if hashlib.md5(content).hexdigest()!=data['md5']:
              raise ValueError('Irrigation source bytes differ from Dataverse MD5')
          pathlib.Path('/tmp/m1-29-licensed-original-Irrigation.xlsx').write_bytes(content)
          print('Original irrigation file, version and CC BY-NC-SA 4.0 license verified')
          print('New original irrigation SHA256 for independent follow-up pin:',hashlib.sha256(content).hexdigest())
          plot_file=next((x for x in meta['files'] if x['dataFile']['id']==10850227),None)
          if (not plot_file or plot_file.get('restricted',plot_file['dataFile'].get('restricted',True))
              or plot_file['dataFile'].get('filename')!='Plotspecific_processed.csv'
              or plot_file['dataFile'].get('md5')!='bdf0f745e2c496868e3285a43df0ff04'):
              raise ValueError('Original study plot source metadata changed')
          req=urllib.request.Request(base+'/access/datafile/10850227',
                                    headers={'User-Agent':'OpenPotato-M1-31-TreatmentLink/1.0'})
          with urllib.request.urlopen(req,timeout=60) as f: plot_bytes=f.read()
          if hashlib.sha256(plot_bytes).hexdigest()!='8d129262dca38ac98a10f92ccfb1bc46454377020575959fd984c4c5bcab5768':
              raise ValueError('Original plot source SHA256 changed')
          pathlib.Path('/tmp/m1-31-licensed-private-plots.csv').write_bytes(plot_bytes)
          print('Verified original plot file for read-only irrigation treatment join')

          PY
      - name: Count only physical workbook structure and tentative header tokens
        env: {PYTHONPATH: ".:src"}
        run: |
          python -m scripts.wur_irrigation_source_inventory --source /tmp/m1-29-licensed-original-Irrigation.xlsx --out /tmp/m1-29-safe-aggregates
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('/tmp/m1-29-safe-aggregates/m1_29_irrigation_workbook_structure_only.json').read_text())
          assert r['source_doi']=='10.7910/DVN/1LC6W7' and r['source_file_id']==10284791
          assert r['source_license']=='CC BY-NC-SA 4.0'
          assert r['sheet_count']==2 and r['checksum_independently_pinned_before_publication']
          assert r['source_sha256']=='3def99dfb0643abe4d524431702a224bf62abd9489b306fbb89d54fdb3c9f109'
          assert not r['original_sheet_names_or_cell_values_exported']
          assert not r['plot_level_irrigation_dates_or_amounts_verified']
          assert not r['real_wofost_irrigation_schedule_ready']
          print('M1-29 original structure only; no irrigation plot join or model run approved')
          PY
      - name: M1-30 audit six source columns per year and first metadata rows without records
        env: {PYTHONPATH: ".:src"}
        run: |
          python -m scripts.wur_irrigation_schema_probe --source /tmp/m1-29-licensed-original-Irrigation.xlsx --out /tmp/m1-29-safe-aggregates
          python - <<'PY'
          import json,pathlib
          f=pathlib.Path('/tmp/m1-29-safe-aggregates/m1_30_irrigation_source_column_profile.json')
          r=json.loads(f.read_text())
          assert r['source_sha256']=='3def99dfb0643abe4d524431702a224bf62abd9489b306fbb89d54fdb3c9f109'
          assert r['profile']['date_counts_by_year']=={'2019':258,'2020':268}
          assert len(r['profile']['column_profiles'])==6
          assert r['original_records_exported']==0 and not r['wofost_field_run_admissible']
          assert not r['water_units_validated'] and not r['site_plot_treatment_join_verified']
          print('M1-30 typed schema evidence captured. No source irrigation events approved or exported.')
          PY
      - name: M1-31 verify W1/W2 labels and real physical plot treatment assignment
        env: {PYTHONPATH: ".:src"}
        run: |
          python -m scripts.wur_irrigation_event_admission --irrigation /tmp/m1-29-licensed-original-Irrigation.xlsx --plots /tmp/m1-31-licensed-private-plots.csv --out /tmp/m1-29-safe-aggregates
          python - <<'PY'
          import json,pathlib
          report=json.loads(pathlib.Path('/tmp/m1-29-safe-aggregates/m1_31_source_verified_treatment_event_counts_only.json').read_text())
          assert report['source_licence']=='CC BY-NC-SA 4.0'
          assert report['all_site_year_treatment_labels_reconciled']
          assert report['raw_source_rows_or_irrigation_doses_exported']==0
          assert report['plot_ids_exported']==report['raw_individual_dates_exported']==0
          assert len(report['site_year_aggregated_counts'])==4
          assert not report['complete_zero_imputation_permitted']
          assert not report['wofost_agromanagement_ready']
          assert not report['2020_field_biomass_used_for_calibration']
          print('Source field identity and plot irrigation labels checked; no agronomic WOFOST model run')
          PY
      - name: Erase transient original licensed Excel file
        if: always()
        run: rm -f /tmp/m1-29-licensed-original-Irrigation.xlsx /tmp/m1-31-licensed-private-plots.csv
      - uses: actions/upload-artifact@v4
        with:
          name: m1-29-original-WUR-irrigation-WORKBOOK-STRUCTURE-ONLY
          retention-days: 14
          path: /tmp/m1-29-safe-aggregates/*.json
