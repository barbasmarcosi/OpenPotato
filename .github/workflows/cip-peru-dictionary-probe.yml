name: M1 CIP Peru public variable dictionary discovery
on:
  workflow_dispatch:
  push:
    branches: [research/m1-nutrition-baseline]
    paths: [".github/workflows/cip-peru-dictionary-probe.yml"]
permissions:
  contents: read
jobs:
  public-dataverse-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect PUBLIC dataset metadata without accessing restricted files
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request,pathlib
          base="https://data.cipotato.org/api/datasets/:persistentId/?persistentId="
          doi="doi:10.21223/N11QJS"
          url=base+urllib.parse.quote(doi,safe="")
          req=urllib.request.Request(url,headers={"User-Agent":"OpenPotato-M1-12-metadata-audit/0.1"})
          with urllib.request.urlopen(req,timeout=45) as f: result=json.load(f)
          if result.get("status")!="OK":
              raise ValueError("Dataverse public metadata endpoint status changed")
          data=result["data"]["latestVersion"]
          if data.get("versionNumber")!=1:
              raise ValueError("Dataverse dataset version not expected 1.x")
          metadata=data.get("metadataBlocks",{}).get("citation",{}).get("fields",[])
          fields=[{"typeName":f.get("typeName"),"value":f.get("value")}
                  for f in metadata if f.get("typeName") in (
                    "title","dsDescription","keyword","subject","kindOfData","otherReferences",
                    "dataSources","notesText","producer","author","grantNumber")]
          files=[]
          for entry in data["files"]:
              f=entry.get("dataFile",{})
              files.append({
                  "id":f.get("id"),"name":f.get("filename"),"description":entry.get("description"),
                  "restricted":entry.get("restricted",f.get("restricted")),
                  "contentType":f.get("contentType"),
                  "variables":f.get("variables"),
                  "variableMetadata":f.get("variableMetadata"),
                  "storageIdentifier":None})
          report={"dataset_doi":doi,"version":data.get("versionNumber"),
                  "minor":data.get("versionMinorNumber"),"metadata_fields":fields,"files":files}
          dest=pathlib.Path("/tmp/cip-peru-dictionary")
          dest.mkdir(parents=True,exist_ok=True)
          (dest/"public_dataverse_metadata_inventory.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PUBLIC_METADATA_REPORT",json.dumps(report,ensure_ascii=False)[:24000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m1-cip-peru-public-data-dictionary-inventory
          retention-days: 30
          path: /tmp/cip-peru-dictionary/
